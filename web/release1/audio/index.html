<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Paws release-one audio inspection</title>
<h1>Release-one audio inspection</h1>
<p>Development harness. Committed-event fixtures are not puzzle gameplay. Missing production audio stays silent.</p>
<button onclick="Module._audio_enable()">Enable sound</button>
<button onclick="Module._audio_scene()">Replace scene</button>
<label><input id="pause" type="checkbox">Pause</label>
<label><input id="mute" type="checkbox">Mute</label>
<p><label>Music <input id="music" type="range" min="0" max="100" value="70"></label>
<label>Ambience <input id="ambience" type="range" min="0" max="100" value="60"></label>
<label>Effects <input id="effects" type="range" min="0" max="100" value="80"></label></p>
<button onclick="Module._audio_music(0)">Garden: chapters 1–3</button>
<button onclick="Module._audio_music(1)">Puzzle: chapters 1–3</button>
<button onclick="Module._audio_music(2)">Picnic resolving phrase</button>
<p>Bell symbols: leaf / star / paw. Sound is optional; the rules own the visible sequence.</p>
<label>Cue <select id="cue"></select></label>
<button onclick="Module._audio_cue(Number(cue.value),0)">Commit fixture</button>
<button onclick="Module._audio_cue(Number(cue.value),1)">Reject stale fixture</button>
<pre id="status">Loading…</pre>
<script src="engine-audio.js"></script><script src="paws-audio.js"></script>
<script>
var Module={};
const cue=document.getElementById('cue');
fetch('catalog.json').then(r=>r.json()).then(m=>m.clips.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=c.id+(c.accepted?'':' — missing');cue.append(o);}));
const ids=['music','ambience','effects','mute'];
for(const id of ids)document.getElementById(id).oninput=()=>Module._audio_settings(+document.getElementById('music').value,+document.getElementById('ambience').value,+document.getElementById('effects').value,document.getElementById('mute').checked);
const suspend=()=>Module._audio_suspend?.(document.hidden||document.getElementById('pause').checked);
document.getElementById('pause').onchange=suspend;document.addEventListener('visibilitychange',suspend);
setInterval(()=>{document.getElementById('status').textContent=JSON.stringify({runtime:window.audioPreview,loading:PawsAudioHost.stats},null,2);},250);
</script><script src="release1_preview.js"></script></html>
